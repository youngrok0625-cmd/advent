<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대림절 말씀 배경화면 만들기 | 온미니스트리</title>
<meta name="description" content="대림절 묵상 노트의 오늘 그림과 말씀으로 나만의 배경화면 · 스토리를 만들어요.">
<meta property="og:title" content="대림절 말씀 배경화면 만들기">
<meta property="og:description" content="오늘의 그림과 말씀으로 나만의 배경화면 · 스토리를 만들어요. — 온미니스트리">
<meta property="og:image" content="https://advent.onministry.co.kr/img/og.jpg">
<meta property="og:url" content="https://advent.onministry.co.kr/">
<meta name="theme-color" content="#1d1640">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&family=Gowun+Batang:wght@700&family=Nanum+Pen+Script&family=Jua&family=Song+Myung&display=swap">
<style>
:root{--bg:#1d1640;--card:#2a2158;--line:#3d3277;--ink:#f4f0ff;--sub:#b9b0dc;--gold:#f2c46d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:460px;margin:0 auto;padding:14px 16px 40px}
header{margin:2px 2px 12px}
header .day{font-size:12px;letter-spacing:.14em;color:var(--gold)}
header h1{font-family:"Noto Serif KR",serif;font-size:20px;margin:4px 0 2px}
header p{margin:0;font-size:13px;color:var(--sub)}
.tonote{color:var(--gold);font-weight:700;text-decoration:none;white-space:nowrap}
.stage{position:relative;border-radius:14px;overflow:hidden;background:#000;touch-action:none;user-select:none;margin:0 auto}
.stage canvas{display:block;width:100%;height:auto}
.hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);pointer-events:none;transition:opacity .4s}
.tabs{display:flex;gap:4px;margin:14px 0 0;background:var(--card);border-radius:12px;padding:4px}
.tabs button{flex:1;border:none;background:none;color:var(--sub);font-family:inherit;font-size:14px;padding:9px 0;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--gold);color:#2a1c00;font-weight:700}
.panel{padding:6px 2px 0;min-height:150px}
.lead{font-size:13px;color:var(--sub);margin:10px 0 4px}
.row{display:flex;align-items:center;gap:10px;margin:10px 0}
.row label{width:72px;font-size:13px;color:var(--sub);flex:none}
input[type=range]{flex:1;accent-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;font-size:14px;font-family:inherit;cursor:pointer}
.chip.on{border-color:var(--gold);background:rgba(242,196,109,.16);color:var(--gold)}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.tg button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;cursor:pointer;text-align:left}
.tg button i{width:18px;height:18px;border-radius:5px;border:2px solid var(--line);flex:none;position:relative}
.tg button.on{border-color:var(--gold)}
.tg button.on i{background:var(--gold);border-color:var(--gold)}
.tg button.on i:after{content:"";position:absolute;left:4px;top:0;width:5px;height:10px;border:solid #2a1c00;border-width:0 2px 2px 0;transform:rotate(45deg)}
.sec{font-size:12px;letter-spacing:.08em;color:var(--gold);margin:16px 0 2px}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.sw button{border:2px solid transparent;border-radius:10px;padding:0;background:none;cursor:pointer;color:var(--ink);font-family:inherit;font-size:12px}
.sw button canvas{width:100%;border-radius:8px;display:block}
.sw button span{display:block;padding:4px 0 2px}
.sw button.on{border-color:var(--gold)}
textarea{width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit;line-height:1.6;resize:vertical;margin-top:4px}
textarea::placeholder{color:#857bb3}
.nav{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
.btn.p{background:var(--gold);color:#2a1c00}
.btn.s{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.msg{font-size:13px;color:var(--sub);text-align:center;margin-top:10px;min-height:18px}
.hide{display:none}
.sheet.hide{display:none}
.dnav{display:flex;align-items:center;gap:10px}
.dnav button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--gold);font-size:18px;line-height:1;cursor:pointer;flex:none}
.dnav button:disabled{opacity:.3}
footer{margin-top:28px;font-size:12px;line-height:1.7;color:var(--sub);text-align:center}
footer a{color:var(--gold);text-decoration:none;font-weight:700}
.vlist{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.vlist button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6;font-family:inherit;text-align:left;cursor:pointer}
.vlist button b{display:block;font-size:12px;color:var(--gold);font-weight:500;margin-bottom:2px}
.vlist button.on{border-color:var(--gold);background:rgba(242,196,109,.12)}
.small{font-size:12px;color:var(--sub);margin-top:4px}
.sheet{position:fixed;inset:0;background:rgba(10,6,28,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:9}
.sheet img{max-width:100%;max-height:72vh;border-radius:12px}
.sheet p{font-size:14px;color:var(--ink);margin:14px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="dnav"><button id="prev" aria-label="이전 날">‹</button><div class="day" id="hday"></div><button id="next" aria-label="다음 날">›</button></div>
    <h1 id="htitle"></h1>
    <p>오늘의 그림으로 나만의 배경화면 · 스토리를 만들어요. <a class="tonote" id="tonote" href="note/">오늘 묵상하기 →</a></p>
  </header>
  <div class="stage" id="stage"><canvas id="cv"></canvas><div class="hint" id="hint"></div></div>
  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"></div>
  <div class="nav"><button class="btn s" id="reset">처음으로</button><button class="btn p" id="save">저장하기</button></div>
  <div class="msg" id="msg"></div>
  <footer>
    <a href="https://www.onministry.co.kr">ON MINISTRY</a> · 대림절 묵상 노트와 함께 쓰는 도구<br>
    성경 본문: 성경전서 개역개정판 © 대한성서공회
  </footer>
</div>
<div class="sheet hide" id="sheet"><img id="final" alt="완성된 그림"><p id="sheetmsg">그림을 길게 눌러 저장해 주세요.</p><button class="btn s" style="flex:none;padding:12px 28px" id="close">닫기</button></div>

<script>
const DAYS = [{"n": 1, "m": 11, "d": 29, "wk": 1, "theme": "소망", "title": "어둠 속에 비친 큰 빛", "ref": "이사야 9:2, 6-7", "key": 2, "vs": [{"ref": "이사야 9:2", "t": "흑암에 행하던 백성이 큰 빛을 보고 사망의 그늘진 땅에 거주하던 자에게 빛이 비치도다"}, {"ref": "이사야 9:6", "t": "이는 한 아기가 우리에게 났고 한 아들을 우리에게 주신 바 되었는데 그의 어깨에는 정사를 메었고 그의 이름은 기묘자라, 모사라, 전능하신 하나님이라, 영존하시는 아버지라, 평강의 왕이라 할 것임이라"}, {"ref": "이사야 9:7", "t": "그 정사와 평강의 더함이 무궁하며 또 다윗의 왕좌와 그의 나라에 군림하여 그 나라를 굳게 세우고 지금 이후로 영원히 정의와 공의로 그것을 보존하실 것이라 만군의 여호와의 열심이 이를 이루시리라"}]}, {"n": 2, "m": 11, "d": 30, "wk": 1, "theme": "소망", "title": "하나님이 친히 주시는 징조", "ref": "이사야 7:10-14", "key": 14, "vs": [{"ref": "이사야 7:10", "t": "여호와께서 또 아하스에게 말씀하여 이르시되"}, {"ref": "이사야 7:11", "t": "너는 네 하나님 여호와께 한 징조를 구하되 깊은 데에서든지 높은 데에서든지 구하라 하시니"}, {"ref": "이사야 7:12", "t": "아하스가 이르되 나는 구하지 아니하겠나이다 나는 여호와를 시험하지 아니하겠나이다 한지라"}, {"ref": "이사야 7:13", "t": "이사야가 이르되 다윗의 집이여 원하건대 들을지어다 너희가 사람을 괴롭히고서 그것을 작은 일로 여겨 또 나의 하나님을 괴롭히려 하느냐"}, {"ref": "이사야 7:14", "t": "그러므로 주께서 친히 징조를 너희에게 주실 것이라 보라 처녀가 잉태하여 아들을 낳을 것이요 그의 이름을 임마누엘이라 하리라"}]}, {"n": 3, "m": 12, "d": 1, "wk": 1, "theme": "소망", "title": "다윗에게서 나는 의로운 가지", "ref": "예레미야 23:3-6", "key": 5, "vs": [{"ref": "예레미야 23:3", "t": "내가 내 양 떼의 남은 것을 그 몰려 갔던 모든 지방에서 모아 다시 그 우리로 돌아오게 하리니 그들의 생육이 번성할 것이며"}, {"ref": "예레미야 23:4", "t": "내가 그들을 기르는 목자들을 그들 위에 세우리니 그들이 다시는 두려워하거나 놀라거나 잃어 버리지 아니하리라 여호와의 말씀이니라"}, {"ref": "예레미야 23:5", "t": "여호와의 말씀이니라 보라 때가 이르리니 내가 다윗에게 한 의로운 가지를 일으킬 것이라 그가 왕이 되어 지혜롭게 다스리며 세상에서 정의와 공의를 행할 것이며"}, {"ref": "예레미야 23:6", "t": "그의 날에 유다는 구원을 받겠고 이스라엘은 평안히 살 것이며 그의 이름은 여호와 우리의 공의라 일컬음을 받으리라"}]}, {"n": 4, "m": 12, "d": 2, "wk": 1, "theme": "소망", "title": "작은 베들레헴에서", "ref": "미가 5:2-5", "key": 2, "vs": [{"ref": "미가 5:2", "t": "베들레헴 에브라다야 너는 유다 족속 중에 작을지라도 이스라엘을 다스릴 자가 네게서 내게로 나올 것이라 그의 근본은 상고에, 영원에 있느니라"}, {"ref": "미가 5:3", "t": "그러므로 여인이 해산하기까지 그들을 붙여 두시겠고 그 후에는 그의 형제 가운데에 남은 자가 이스라엘 자손에게로 돌아오리니"}, {"ref": "미가 5:4", "t": "그가 여호와의 능력과 그의 하나님 여호와의 이름의 위엄을 의지하고 서서 목축하니 그들이 거주할 것이라 이제 그가 창대하여 땅 끝까지 미치리라"}, {"ref": "미가 5:5", "t": "이 사람은 평강이 될 것이라 앗수르 사람이 우리 땅에 들어와서 우리 궁들을 밟을 때에는 우리가 일곱 목자와 여덟 군왕을 일으켜 그를 치리니"}]}, {"n": 5, "m": 12, "d": 3, "wk": 1, "theme": "소망", "title": "길을 예비하라", "ref": "이사야 40:1-5", "key": 3, "vs": [{"ref": "이사야 40:1", "t": "너희의 하나님이 이르시되 너희는 위로하라 내 백성을 위로하라"}, {"ref": "이사야 40:2", "t": "너희는 예루살렘의 마음에 닿도록 말하며 그것에게 외치라 그 노역의 때가 끝났고 그 죄악이 사함을 받았느니라 그의 모든 죄로 말미암아 여호와의 손에서 벌을 배나 받았느니라 할지니라 하시니라"}, {"ref": "이사야 40:3", "t": "외치는 자의 소리여 이르되 너희는 광야에서 여호와의 길을 예비하라 사막에서 우리 하나님의 대로를 평탄하게 하라"}, {"ref": "이사야 40:4", "t": "골짜기마다 돋우어지며 산마다, 언덕마다 낮아지며 고르지 아니한 곳이 평탄하게 되며 험한 곳이 평지가 될 것이요"}, {"ref": "이사야 40:5", "t": "여호와의 영광이 나타나고 모든 육체가 그것을 함께 보리라 이는 여호와의 입이 말씀하셨느니라"}]}, {"n": 6, "m": 12, "d": 4, "wk": 1, "theme": "소망", "title": "좋은 소식을 전하는 발", "ref": "이사야 52:7-10", "key": 7, "vs": [{"ref": "이사야 52:7", "t": "좋은 소식을 전하며 평화를 공포하며 복된 좋은 소식을 가져오며 구원을 공포하며 시온을 향하여 이르기를 네 하나님이 통치하신다 하는 자의 산을 넘는 발이 어찌 그리 아름다운가"}, {"ref": "이사야 52:8", "t": "네 파수꾼들의 소리로다 그들이 소리를 높여 일제히 노래하니 이는 여호와께서 시온으로 돌아오실 때에 그들의 눈이 마주 보리로다"}, {"ref": "이사야 52:9", "t": "너 예루살렘의 황폐한 곳들아 기쁜 소리를 내어 함께 노래할지어다 이는 여호와께서 그의 백성을 위로하셨고 예루살렘을 구속하셨음이라"}, {"ref": "이사야 52:10", "t": "여호와께서 열방의 목전에서 그의 거룩한 팔을 나타내셨으므로 땅 끝까지도 모두 우리 하나님의 구원을 보았도다"}]}, {"n": 7, "m": 12, "d": 5, "wk": 1, "theme": "소망", "title": "일어나라, 빛을 발하라", "ref": "이사야 60:1-5", "key": 1, "vs": [{"ref": "이사야 60:1", "t": "일어나라 빛을 발하라 이는 네 빛이 이르렀고 여호와의 영광이 네 위에 임하였음이니라"}, {"ref": "이사야 60:2", "t": "보라 어둠이 땅을 덮을 것이며 캄캄함이 만민을 가리려니와 오직 여호와께서 네 위에 임하실 것이며 그의 영광이 네 위에 나타나리니"}, {"ref": "이사야 60:3", "t": "나라들은 네 빛으로, 왕들은 비치는 네 광명으로 나아오리라"}, {"ref": "이사야 60:4", "t": "네 눈을 들어 사방을 보라 무리가 다 모여 네게로 오느니라 네 아들들은 먼 곳에서 오겠고 네 딸들은 안기어 올 것이라"}, {"ref": "이사야 60:5", "t": "그 때에 네가 보고 기쁜 빛을 내며 네 마음이 놀라고 또 화창하리니 이는 바다의 부가 네게로 돌아오며 이방 나라들의 재물이 네게로 옴이라"}]}, {"n": 8, "m": 12, "d": 6, "wk": 2, "theme": "평화", "title": "그루터기에서 돋는 싹", "ref": "이사야 11:1, 6-9", "key": 1, "vs": [{"ref": "이사야 11:1", "t": "이새의 줄기에서 한 싹이 나며 그 뿌리에서 한 가지가 나서 결실할 것이요"}, {"ref": "이사야 11:6", "t": "그 때에 이리가 어린 양과 함께 살며 표범이 어린 염소와 함께 누우며 송아지와 어린 사자와 살진 짐승이 함께 있어 어린 아이 function cropRect(){
  const iw=img.width, ih=img.height, ar=S.ar;
  const w0=Math.min(iw, ih/ar), h0=w0*ar, cw=w0/S.zoom, ch=h0/S.zoom;
  S.cx=Math.max(cw/2,Math.min(iw-cw/2,S.cx)); S.cy=Math.max(ch/2,Math.min(ih-ch/2,S.cy));
  return {sx:S.cx-cw/2, sy:S.cy-ch/2, cw, ch};
}
let boxes={};
function draw(out,W,opts={}){
  const H=Math.round(W*S.ar); out.width=W; out.height=H;
  const r=cropRect();
  const base=mk(W,H), b=base.getContext("2d"); b.imageSmoothingQuality="high";
  b.drawImage(img,r.sx,r.sy,r.cw,r.ch,0,0,W,H);
  const P=PRESETS[opts.preset ?? S.preset];
  pixel(b,W,H,P,S.bright);
  const o=out.getContext("2d");
  if (S.famt>0.01){
    const s=1+S.famt*16, sw=Math.max(8,Math.round(W/s)), sh=Math.max(8,Math.round(H/s));
    const sm=mk(sw,sh), sc=sm.getContext("2d"); sc.imageSmoothingQuality="high"; sc.drawImage(base,0,0,sw,sh);
    const sm2=mk(Math.max(4,sw>>1),Math.max(4,sh>>1)); sm2.getContext("2d").drawImage(sm,0,0,sm2.width,sm2.height);
    sc.clearRect(0,0,sw,sh); sc.drawImage(sm2,0,0,sw,sh);
    o.imageSmoothingQuality="high"; o.drawImage(sm,0,0,W,H);
    const sharp=mk(W,H), k=sharp.getContext("2d"); k.drawImage(base,0,0);
    k.globalCompositeOperation="destination-in";
    const x=S.fx*W,y=S.fy*H,R=Math.min(W,H)*.5, g=k.createRadialGradient(x,y,R*.25,x,y,R);
    g.addColorStop(0,"rgba(0,0,0,1)"); g.addColorStop(1,"rgba(0,0,0,0)");
    k.fillStyle=g; k.fillRect(0,0,W,H); o.drawImage(sharp,0,0);
  } else o.drawImage(base,0,0);
  if (P.vig){
    const g=o.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.hypot(W,H)*.55);
    g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(1,`rgba(10,5,25,${P.vig})`);

    g.addColorStop(0,`rgba(255,214,140,${.85*S.lamt})`); g.addColorStop(.35,`rgba(255,180,90,${.45*S.lamt})`); g.addColorStop(1,"rgba(255,160,80,0)");
    o.fillStyle=g; o.fillRect(0,0,W,H); o.globalCompositeOperation="source-over";
  }
  if (!opts.noText){
    const bx={};
    for (const k of ["candle","day","verse","progress","tags","stamp","logo"]) if (S.show[k]) bx[k]=element(o,W,H,k);
    if (opts.guides){
      for (const k in bx){const q=bx[k]; o.save(); o.setLineDash([W/90,W/120]); o.lineWidth=W/320;
        o.strokeStyle=k===S.sel?"rgba(242,196,109,.95)":"rgba(255,255,255,.45)";

function pixel(ctx,W,H,P,bright){
  if (!bright && !Object.keys(P).some(k=>k!=="vig")) return;
  const d=ctx.getImageData(0,0,W,H), a=d.data;
  const sat=P.sat??1, con=P.con??1, warm=P.warm??0, fade=P.fade??0, t=P.tint;
  for (let i=0;i<a.length;i+=4){
    let r=a[i],g=a[i+1],b=a[i+2];
    if (bright<0){const m=1+bright;r*=m;g*=m;b*=m;}
    else if (bright>0){const m=bright*.75;r+=(255-r)*m;g+=(255-g)*m;b+=(255-b)*m;}
    if (con!==1){r=(r-128)*con+128;g=(g-128)*con+128;b=(b-128)*con+128;}
    if (sat!==1){const y=.299*r+.587*g+.114*b;r=y+(r-y)*sat;g=y+(g-y)*sat;b=y+(b-y)*sat;}
    if (warm){r+=warm;g+=warm*.3;b-=warm;}

function wrap(o,txt,maxw){
  const lines=[];

    for (const w of words){

      if (o.measureText(tryL).width<=maxw){cur=tryL;continue;}
      if (cur) lines.push(cur);
      if (o.measureText(w).width<=maxw){cur=w;continue;}
      cur=""; for(const ch of w){ if(o.measureText(cur+ch).width>maxw&&cur){lines.push(cur);cur=ch;} else cur+=ch; }
    }
    lines.push(cur);
  });
  return lines;
}

    const fs=U*5.6*F.s, lh=fs*(F.s>1.2?1.25:1.5);

    const ref = S.vi>=0 && S.show.ref ? D.vs[S.vi].ref : "";

  }
  if (k==="day"){

    o.font=`700 ${f1}px "Noto Sans KR", sans-serif`; const a=`ADVENT · DAY ${n}`, wa=o.measureText(a).width;
    o.font=`500 ${f2}px "Noto Sans KR", sans-serif`; const bb=`${D.m}.${D.d} · 대림절 ${D.wk}주 ${D.theme}`, wb=o.measureText(bb).width;
    w=Math.max(wa,wb); h=f1*1.3+f2*1.3;

    o.font=`500 ${f2}px "Noto Sans KR", sans-serif`; o.fillText(bb,x0,y0+f1*1.3+f2*.65);
  }

    w=Math.max(o.measureText(label).width, gap*26+wkGap*3+r*2); h=fs*1.4+U*1.2+r*2;

function stamp(o,cx,cy,U){

  const ink= hasImg ? (t==="c"?"#5a2340":"#f5cf7a") : (t==="b"?"#3a2a12":t==="c"?"#5a2340":t==="full"?"#f6c6d8":"#f2c46d");

    o.font=`700 ${U*3.4}px "Noto Sans KR", sans-serif`; o.fillText("완주",0,U*2.6);

}

    h=`<div class="row"><label>어둠 · 밝음</label><input type="range" id="bright" min="-.7" max=".5" step=".01" value="${S.bright}"></div>
      <div class="row"><label>빛 더하기</label><input type="range" id="lamt" min="0" max="1" step=".01" value="${S.lamt}"></div>`;}
  if (S.tab==="초점"){ hint("또렷하게 볼 곳을 눌러 보세요");
    h=`<div class="row"><label>흐리게</label><input type="range" id="famt" min="0" max="1" step=".01" value="${S.famt}"></div>`;}
  if (S.tab==="색"){ hint("");
    h=`<div class="sw">${Object.keys(PRESETS).map(nn=>`<button class="${S.preset===nn?'on':''}" data-p="${nn}"><canvas data-thumb="${nn}"></canvas><span>${nn}</span></button>`).join("")}</div>`;}
  if (S.tab==="넣기"){ hint("글씨를 끌어서 옮길 수 있어요");
    const T=[["verse","말씀"],["ref","장절"],["day","날짜 · 주제"],["candle","대림초"],["stamp","묵상 완료 도장"],["progress","진행 표시"],["tags","해시태그"],["logo","ON MINISTRY"]];
    h=`<div class="lead">그림에 넣을 것</div>
      <div class="tg">${T.map(([k,nn])=>`<button class="${S.show[k]?'on':''}" data-show="${k}"><i></i>${nn}</button>`).join("")}</div>
      <div class="sec">크기 · <span id="selname">${NAMES[S.sel]}</span></div>
      <div class="small">그림 속 글씨나 대림초를 누르면 그것의 크기를 바꿀 수 있어요.</div>
      <div class="row"><label>크기</label><input type="range" id="esize" min=".5" max="1.8" step=".01" value="${S.size[S.sel]}"></div>
      <div id="vopts" class="${S.show.verse?'':'hide'}">
        <div class="sec">오늘 말씀에서 고르기</div>
        <div class="vlist">${D.vs.map((v,i)=>`<button class="${S.vi===i?'on':''}" data-vi="${i}"><b>${v.ref}</b>${esc(v.t)}</button>`).join("")}
          <button class="${S.vi===-1?'on':''}" data-vi="-1"><b>내 글</b>직접 써서 넣기</button></div>
        <div class="small">고른 말씀은 아래에서 줄을 나누거나 필요한 부분만 남길 수 있어요.</div>
        <textarea rows="3" id="vtext">${esc(S.vtext)}</textarea>
        <div class="sec">글꼴</div>
        <div class="chips">${Object.keys(FONTS).map(nn=>`<button class="chip ${S.font===nn?'on':''}" data-font="${nn}" style="font-family:${FONTS[nn].f};font-weight:${FONTS[nn].w};font-size:${15*FONTS[nn].s}px">${nn}</button>`).join("")}</div>
      </div>
      <div id="sopts" class="${S.show.stamp?'':'hide'}">
        <div class="sec">도장</div>
        <div class="chips">${Object.keys(STAMPS).map(k=>{const dis=k==="full"&&!fullOK();return `<button class="chip ${S.stampType===k?'on':''}" data-st="${k}" ${dis?'disabled style="opacity:.4"':''}>${STAMPS[k]}${k==="full"?` (${doneWithToday().size}/27)`:''}</button>`;}).join("")}</div>
        <div class="small">27일을 모두 채우면 「27일 완주」 도장이 열려요.</div>
      </div>
      <div id="topts" class="${S.show.tags?'':'hide'}">
        <div class="sec">해시태그</div>
        <div class="chips"><button class="chip ${S.tag1?'on':''}" data-tag="tag1">${TAG1}</button><button class="chip ${S.tag2?'on':''}" data-tag="tag2">${TAG2}</button></div>
        <input type="text" id="tagown" value="${esc(S.tagOwn)}" placeholder="내 해시태그 (예: 은파교회 중고등부)" style="width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit">
      </div>
      <div class="small" style="margin-top:12px">내 기록: ${doneWithToday().size}/27일 — 저장할 때마다 이 폰에 그날이 기록돼요.</div>
      <div class="sec">글자 색</div>
      <div class="chips">${[["#ffffff","흰색"],["#f2c46d","금빛"],["#f6c6d8","연분홍"],["#2a1f55","진보라"]].map(([v,nn])=>chip("col",v,nn,S.tcolor===v)).join("")}</div>`;}
  $("#panel").innerHTML=h; bind(); if (S.tab==="색") thumbs();
}
function bind(){
  const P=$("#panel");
  ["zoom","bright","lamt","famt"].forEach(id=>{const e=$("#"+id);if(e)e.oninput=()=>{S[id]=+e.value;render();};});
  const es=$("#esize"); if(es) es.oninput=()=>{S.size[S.sel]=+es.value;render();};
  P.querySelectorAll("[data-ar]").forEach(b=>b.onclick=()=>{S.ar=+b.dataset.ar;panel();render();});
  P.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{S.preset=b.dataset.p;P.querySelectorAll("[data-p]").forEach(x=>x.classList.toggle("on",x===b));render();});
  P.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{const k=b.dataset.show;S.show[k]=!S.show[k];b.classList.toggle("on",S.show[k]);if(k==="verse")$("#vopts").classList.toggle("hide",!S.show.verse);if(k==="stamp"){$("#sopts").classList.toggle("hide",!S.show.stamp);if(S.show.stamp)select("stamp");}if(k==="tags")$("#topts").classList.toggle("hide",!S.show.tags);if(k==="progress"&&S.show.progress)select("progress");render();});
  P.querySelectorAll("[data-vi]").forEach(b=>b.onclick=()=>{S.vi=+b.dataset.vi;S.vtext=S.vi>=0?D.vs[S.vi].t:"";$("#vtext").value=S.vtext;
    S.size.verse=fitSize(S.vtext);
    P.querySelectorAll("[data-vi]").forEach(x=>x.classList.toggle("on",x===b));select("verse");render();});
  const vt=$("#vtext"); if(vt) vt.oninput=()=>{S.vtext=vt.value;render();};
  P.querySelectorAll("[data-font]").forEach(b=>b.onclick=()=>{S.font=b.dataset.font;const F=FONTS[S.font];
    P.querySelectorAll("[data-font]").forEach(x=>x.classList.toggle("on",x===b));render();
    document.fonts&&document.fonts.load(`${F.w} 40px ${F.f}`,"가나다").then(render).catch(()=>{});});
  P.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{S.stampType=b.dataset.st;P.querySelectorAll("[data-st]").forEach(x=>x.classList.toggle("on",x===b));select("stamp");render();});
  P.querySelectorAll("[data-tag]").forEach(b=>b.onclick=()=>{const k=b.dataset.tag;S[k]=!S[k];b.classList.toggle("on",S[k]);render();});
  const tw=$("#tagown"); if(tw) tw.oninput=()=>{S.tagOwn=tw.value;render();};
  P.querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>{S.tcolor=b.dataset.col;P.querySelectorAll("[data-col]").forEach(x=>x.classList.toggle("on",x===b));render();});
}
function fitSize(t){const L=(t||"").length; return L>90?.62:L>60?.72:L>35?.85:1;}
function select(k){ S.sel=k; const s=$("#selname"); if(s) s.textContent=NAMES[k]; const es=$("#esize"); if(es) es.value=S.size[k]; }

// 그림 위 손가락 조작
let drag=null;
function norm(e){const b=stg.getBoundingClientRect();return [(e.clientX-b.left)/b.width,(e.clientY-b.top)/b.height];}
function hit(x,y){
  const order=["stamp","tags","progress","logo","verse","day","candle"]; const pad=.03;
  for (const k of order){const q=boxes[k]; if(q&&x>=q.x-pad&&x<=q.x+q.w+pad&&y>=q.y-pad&&y<=q.y+q.h+pad) return k;}
  return null;
}
stg.onpointerdown=e=>{
  stg.setPointerCapture(e.pointerId); hint("");
  const [x,y]=norm(e);
  if (S.tab==="자르기") drag={mode:"pan",x:e.clientX,y:e.clientY};
  else if (S.tab==="빛"||S.tab==="초점"){drag={mode:"tap"}; setPoint(x,y);}
  else if (S.tab==="넣기"){ const k=hit(x,y); if(k){select(k);drag={mode:"move",k,x,y};render();} }
};
stg.onpointermove=e=>{
  if(!drag) return;
  const [x,y]=norm(e);
  if (drag.mode==="tap") return setPoint(x,y);
  if (drag.mode==="pan"){const r=cropRect(),k=r.cw/stg.clientWidth;S.cx-=(e.clientX-drag.x)*k;S.cy-=(e.clientY-drag.y)*k;drag.x=e.clientX;drag.y=e.clientY;render();return;}
  if (drag.mode==="move"){
    const p=S.pos[drag.k]; p[0]=Math.max(.02,Math.min(.98,p[0]+x-drag.x)); p[1]=Math.max(.02,Math.min(.98,p[1]+y-drag.y));
    drag.x=x; drag.y=y;
    if (Math.abs(p[0]-.5)<.015) p[0]=.5;  // 가운데에 붙기
    render();
  }
};
stg.onpointerup=stg.onpointercancel=()=>drag=null;
function setPoint(x,y){
  if (S.tab==="빛"){S.lx=x;S.ly=y;if(S.lamt<.05){S.lamt=.6;$("#lamt").value=.6;}}
  else {S.fx=x;S.fy=y;if(S.famt<.05){S.famt=.5;$("#famt").value=.5;}}
  render();
}

function record(){ DONE.add(n); saveDone(DONE); if(S.tab==="넣기") panel(); render(); }
function msg(t){$("#msg").textContent=t;}
$("#reset").onclick=()=>{const t=S.tab;Object.assign(S,JSON.parse(JSON.stringify(DEF)));S.tab=t;tabs();panel();render();msg("");};
$("#close").onclick=()=>$("#sheet").classList.add("hide");
$("#save").onclick=async()=>{
  if(!ready) return;
  const c=mk(1,1); draw(c,1080,{});
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.93));
  const nm=S.ar>1.5?"배경화면":S.ar>1.1?"피드":"정사각";
  const name=`대림절_DAY${String(n).padStart(2,"0")}_${nm}.jpg`;
  const file=new File([blob],name,{type:"image/jpeg"});
  const mobile=/iPhone|iPad|Android/i.test(navigator.userAgent);
  if (mobile && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); record(); msg(`오늘 묵상을 기록했어요 (${DONE.size}/27). 「이미지 저장」을 눌러 사진첩에 넣어요.`); return; }
    catch(e){ if(e&&e.name==="AbortError"){ msg(""); return; } }
  }
  if (!mobile){
    const u=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000); record(); msg(`내려받았어요. 오늘 묵상을 기록했어요 (${DONE.size}/27).`); return;
  }
  $("#final").src=URL.createObjectURL(blob); $("#sheet").classList.remove("hide"); record();
};
$("#prev").onclick=()=>{ if(n>1) setDay(n-1); };
$("#next").onclick=()=>{ if(n<27) setDay(n+1); };
setDay(n,true);
document.fonts && document.fonts.load('700 40px "Noto Serif KR"').then(render).catch(()=>{});
tabs(); panel(); render();
</script>
</body>
</html>
